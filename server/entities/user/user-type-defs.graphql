enum UserRole {
  ADMIN,
  USER
}

type User {
  id: ID!
  email: String!
  name: String!
  role: UserRole!
  appliedJobs: [Job!]!
  ownedJobs: [Job!]!
}

input SignUpInput {
  email: String!
  password: String!
  name: String!
  role: UserRole!
}

input LoginInput {
  email: String!
  password: String!
}

type Mutation {
  signup(input: SignUpInput!): User!
  login(input: LoginInput!): User!
  logout: Boolean!
}

type Query {
  me: User!
}